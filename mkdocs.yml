site_name: core docs
site_description: ESP32 tabanlı robot yarışması yazılım kütüphanesi dokümantasyonu
site_url: https://docs.probotstudio.com
site_author: Tuna Gül
copyright: "© 2026 Tuna Gül"
repo_url: https://github.com/probot-studio/probot-core

# Custom tema — Probot Studio kimliği (Material değil).
# Şablon: theme/main.html · stil: docs/stylesheets/probot.css · JS: docs/assets/theme.js
theme:
  name: null
  custom_dir: theme

nav:
  - Giriş: index.md
  - Kurulum: kurulum.md
  - İlk Bakış: baslangic.md
  - Yazılım: yazilim.md
  - Tuna'nın Yarışma Notları: notlar.md
  - Örnek Robot: ornekler.md
  - Hatalar: hatalar.md
  - Sinyal Temizliği: saha.md
  - LLMs: llms.md

plugins:
  - search
  - rss

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - meta

# Ana site kökü — header/footer site linkleri + /brand/header.js buradan kurulur.
# Dev önizleme mkdocs.dev.yml'de dev.probotstudio.com ile override eder.
extra:
  site_root: https://probotstudio.com
  # TEK KAYNAK: kütüphane sürümü (core deposundaki VERSION dosyasının aynası).
  # Core sürüm bump'ında yalnız bu satır güncellenir; rozet tüm sayfalara temadan basılır.
  core_version: 0.4.0

extra_css:
  - stylesheets/probot.css
  - stylesheets/code.css

extra_javascript:
  - assets/theme.js
